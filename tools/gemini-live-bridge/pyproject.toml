[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-gemini-live-bridge"
version = "0.1.0"
description = "Local WebRTC/V3 adapter for Codex and Gemini Live"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.14.4", "aiortc==1.15.0", "aioice==0.10.2", "av==17.1.0", "ifaddr==0.2.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
